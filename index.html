<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEON SNAKE — Аркадная Змейка</title>
  <meta name="description" content="Современная аркадная змейка с неоновой графикой, частицами и анимациями">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Animated background particles -->
  <canvas id="bgCanvas"></canvas>

  <div class="game-container" id="game-container">

    <!-- Header Bar -->
    <header class="hud-bar">
      <div class="hud-item" id="hud-score">
        <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <div class="hud-text">
          <span class="hud-label">СЧЁТ</span>
          <span class="hud-value" id="score">0</span>
        </div>
      </div>
      <div class="hud-item hud-center" id="hud-level">
        <div class="level-badge" id="level-badge">
          <span id="level">1</span>
        </div>
        <span class="hud-label">УРОВЕНЬ</span>
      </div>
      <div class="hud-item" id="hud-best">
        <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 7 7 7 7"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5C17 4 17 7 17 7"/><path d="M4 22h16"/><path d="M10 22V10a2 2 0 0 1 4 0v12"/><rect x="6" y="9" width="12" height="5" rx="1"/></svg>
        <div class="hud-text">
          <span class="hud-label">РЕКОРД</span>
          <span class="hud-value" id="high-score">0</span>
        </div>
      </div>
    </header>

    <!-- Main Game Canvas -->
    <div class="game-board" id="game-board">
      <canvas id="gameCanvas"></canvas>

      <!-- Start / Game Over Overlay -->
      <div id="overlay" class="overlay">
        <div class="overlay-content">
          <div class="logo" id="logo">
            <span class="logo-n">N</span><span class="logo-e">E</span><span class="logo-o">O</span><span class="logo-n2">N</span>
            <br>
            <span class="logo-sub">SNAKE</span>
          </div>
          <p id="overlay-text" class="overlay-text">Управляйте змейкой и собирайте еду</p>

          <!-- Stats (shown on game over) -->
          <div id="stats" class="stats hidden">
            <div class="stat-row"><span>Счёт</span><span id="stat-score">0</span></div>
            <div class="stat-row"><span>Еда собрана</span><span id="stat-food">0</span></div>
            <div class="stat-row"><span>Уровень</span><span id="stat-level">1</span></div>
            <div class="stat-row"><span>Время</span><span id="stat-time">0:00</span></div>
          </div>

          <button id="start-btn" class="btn-play">
            <span id="btn-text">ИГРАТЬ</span>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <p class="overlay-hint">Стрелки / WASD / Свайпы</p>
        </div>
      </div>
    </div>

    <!-- Mobile D-Pad -->
    <div class="dpad" id="dpad">
      <button class="dpad-btn dpad-up" id="dpad-up" aria-label="Вверх">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
      </button>
      <button class="dpad-btn dpad-left" id="dpad-left" aria-label="Влево">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 12l8-8v5h8v6h-8v5z"/></svg>
      </button>
      <div class="dpad-center"></div>
      <button class="dpad-btn dpad-right" id="dpad-right" aria-label="Вправо">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 12l-8 8v-5H4v-6h8V4z"/></svg>
      </button>
      <button class="dpad-btn dpad-down" id="dpad-down" aria-label="Вниз">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20l8-8h-5V4h-6v8H4z"/></svg>
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-hint desktop-only">Стрелки / WASD для управления</span>
      <span class="footer-hint mobile-only">Используйте D-Pad или свайпы</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
